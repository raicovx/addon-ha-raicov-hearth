# required configuration options
name: Hearth (raicov, edge)
# set by .github/workflows/publish.yml to <hearth version>-edge.<commit>
version: 0.5.1-edge.c9a01fa
slug: ha_raicov_hearth_edge
description: Nightly builds of the Hearth development branch, which may break without notice
arch:
  - aarch64
  - amd64

# disable the docker default system init
init: false

# homepage of the add-on
url: https://github.com/raicovx/addon-ha-raicov-hearth

# icon for the menu panel integration
panel_icon: mdi:fireplace

# allow non-administration users
panel_admin: false

# security profile
apparmor: true

# ingress feature for the add-on
ingress: true
ingress_stream: true

# enable api to get host port
hassio_api: true

# port to expose, null defaults to disabled
ports:
  8099/tcp: null

# Browser-facing Home Assistant URL for direct-port access.
options: {}
schema:
  hass_public_url: url?

# published by .github/workflows/publish.yml
image: ghcr.io/raicovx/addon-ha-raicov-hearth-{arch}
