# required configuration options
name: Hearth (raicov, beta)
version: 0.5.0
slug: ha_raicov_hearth_beta
description: Prereleases of Hearth for testing the next version before it becomes stable
arch:
  - aarch64
  - amd64

# disable the docker default system init
init: false

# homepage of the add-on
url: https://github.com/raicovx/addon-ha-raicov-hearth

# icon for the menu panel integration
panel_icon: mdi:fireplace

# allow non-administration users
panel_admin: false

# security profile
apparmor: true

# ingress feature for the add-on
ingress: true
ingress_stream: true

# enable api to get host port
hassio_api: true

# ports to expose, null defaults to disabled; 8443 serves HTTPS when ssl is on
ports:
  8099/tcp: null
  8443/tcp: null

# certificates for the optional HTTPS port
map:
  - type: ssl

# Browser-facing Home Assistant URL for direct-port access.
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  hass_public_url: url?
  ssl: bool
  certfile: str
  keyfile: str

# published by .github/workflows/publish.yml
image: ghcr.io/raicovx/addon-ha-raicov-hearth-{arch}
