configuration:
  hass_public_url:
    name: Home Assistant URL for direct access
    description: >-
      Home Assistant URL reachable by your browser when opening Hearth through
      its exposed port, for example http://homeassistant.local:8123. Use HTTPS
      when Hearth is served over HTTPS. Ingress automatically uses its own
      Home Assistant origin and ignores this setting.
  ssl:
    name: HTTPS
    description: >-
      Serve Hearth over HTTPS on the HTTPS port as well, using a certificate
      from Home Assistant's /ssl folder, such as the one the DuckDNS or
      Let's Encrypt add-on creates. Needed to embed Hearth in an HTTPS Home
      Assistant, for example as a Webpage dashboard.
  certfile:
    name: Certificate file
    description: Certificate file in /ssl.
  keyfile:
    name: Private key file
    description: Private key file in /ssl.
network:
  8099/tcp: "Optional. Plain HTTP port to expose externally, bypassing Ingress. Example: 5050"
  8443/tcp: "Optional. HTTPS port, used when HTTPS is on. Example: 8443"
